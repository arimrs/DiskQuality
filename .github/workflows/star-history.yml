name: Weekly Star History Sync

on:
  schedule:
    # Runs every Monday at 00:00 UTC (08:00 Taipei Time)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Star History SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/generate_star_history.py

      - name: Commit and push updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history-light.svg assets/star-history-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly star history sync"
            git push
          else
            echo "No changes to star history charts."
          fi
